<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · AMAZE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">AMAZE</div>
  <div class="auth-sub">Welcome Back</div>

  <div class="auth-icon"><i class="fas fa-user"></i></div>
  <h2>Sign In</h2>
  <p class="hint">Enter your email and password to continue.</p>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="auth-btn">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
    <div class="auth-error" id="authError"></div>
  </form>

  <div class="auth-switch">
    Don't have an account? <a href="register.html">Create one</a>
  </div>
  <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to website</a>
</div>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
</body>
</html>
