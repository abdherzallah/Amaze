<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · AMAZE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">AMAZE</div>
  <div class="auth-sub">Admin Panel</div>

  <div class="auth-icon"><i class="fas fa-lock"></i></div>
  <h2>Restricted Access</h2>
  <p class="hint">Authorized personnel only.</p>

  <form id="adminLoginForm" novalidate>
    <div class="form-group">
      <label><i class="fas fa-user"></i> Admin Username</label>
      <input type="text" id="adminUser" placeholder="Enter admin username" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label><i class="fas fa-key"></i> Admin Password</label>
      <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="auth-btn">
      <i class="fas fa-sign-in-alt"></i> Enter Dashboard
    </button>
    <div class="auth-error" id="adminErr"></div>
  </form>

  <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to website</a>
</div>

<script src="js/script.js"></script>
<script>
  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const u   = document.getElementById('adminUser').value.trim();
    const p   = document.getElementById('adminPass').value;
    const err = document.getElementById('adminErr');
    const btn = e.target.querySelector('button[type="submit"]');

    err.textContent = '';
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking…';

    try {
      const data = await fetchJson('api/auth.php?action=login', {
        method: 'POST',
        body: { username: u, password: p }
      });

      if (data.ok) {
        err.style.color = '#2d7d46';
        err.textContent = '✓ Access granted. Redirecting…';
        setTimeout(() => { window.location.href = 'admin.html'; }, 500);
      } else {
        err.style.color = '#b45f4b';
        err.textContent = '✗ ' + (data.error || 'Invalid credentials');
        btn.disabled = false;
        btn.innerHTML = original;
      }
    } catch (e2) {
      err.style.color = '#b45f4b';
      err.textContent = '✗ ' + (e2.message || 'Login failed');
      btn.disabled = false;
      btn.innerHTML = original;
    }
  });
</script>
</body>
</html>
